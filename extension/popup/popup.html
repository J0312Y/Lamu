<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lamu AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <div class="header">
      <div class="logo">L</div>
      <span class="title">Lamu AI</span>
      <button id="btn-settings" class="icon-btn" title="Settings">&#9881;</button>
    </div>

    <!-- Settings view -->
    <div id="settings-view" class="hidden">
      <label class="label">API URL</label>
      <input id="cfg-url" class="input" placeholder="http://localhost:3456" />
      <label class="label">API Key</label>
      <input id="cfg-key" class="input" type="password" placeholder="Your API key" />
      <label class="label">Web Token</label>
      <input id="cfg-token" class="input" type="password" placeholder="Webapp JWT token" />
      <div class="btn-row">
        <button id="btn-save-cfg" class="btn">Save</button>
        <button id="btn-cancel-cfg" class="btn btn-secondary">Cancel</button>
      </div>
      <div id="cfg-status" class="status"></div>
    </div>

    <!-- Chat view -->
    <div id="chat-view">
      <div id="messages" class="messages"></div>
      <div class="input-row">
        <textarea id="chat-input" class="input chat-input" placeholder="Ask Lamu AI..." rows="2"></textarea>
        <button id="btn-send" class="btn send-btn">&#9654;</button>
      </div>
      <div class="shortcuts">
        <button class="shortcut-btn" id="btn-summarize">Summarize page</button>
        <button class="shortcut-btn" id="btn-draft">Draft reply</button>
        <button class="shortcut-btn" id="btn-kb">Search KB</button>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
